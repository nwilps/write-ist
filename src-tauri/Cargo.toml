[package]
name = "write-ist"
version = "0.0.0"
description = "A fully local, offline writing application."
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
# Tauri builds the application as a library with a thin binary in front of it,
# so the same code can be built for a desktop binary and for a mobile target
# later. Slice 1 is Linux only (ADR-0001).
name = "write_ist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The shell. It hosts a system webview and nothing else: the parser, the
# serialiser and the pagination engine are TypeScript running inside that
# webview (ADR-0024), so nothing crosses this boundary on the keystroke path.
tauri = { version = "2", features = [] }
# The disk, reached from the webview through `app/src/tauri-filesystem.ts`.
tauri-plugin-fs = "2"
# Choosing the file to import. The writer's own file, read once and never
# written to.
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
