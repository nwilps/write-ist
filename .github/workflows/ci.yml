# Every pull request is checked by a machine, not by an agent's word.
#
# The acceptance corpus is the writer's unpublished screenplay and is not in the
# repository, so the tests that need it skip here (see test/support/corpus.ts).
# Those numbers are run locally and quoted in the pull request instead.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

  # "The application builds and launches on Linux (WebKitGTK)" is an acceptance
  # criterion (#38), so it is checked by a machine from here on rather than
  # taken on the word of whoever last built it. Launching needs a display and is
  # the writer's check (#37's fourth seam); building is this job's.
  builds:
    runs-on: ubuntu-latest
    # A cold run (no Rust cache) takes well under this; anything
    # longer is a hang, and is better failed than left to run for six hours.
    timeout-minutes: 45
    env:
      WEBKITGTK_PACKAGES: >-
        libwebkit2gtk-4.1-dev
        libjavascriptcoregtk-4.1-dev
        libsoup-3.0-dev
        libgtk-3-dev
        librsvg2-dev
        patchelf
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      # The apt mirror sometimes stalls on the first try and answers on a
      # re-run. Retry each download and give up on a dead connection quickly,
      # rather than waiting on it.
      - name: Retry apt downloads
        run: |
          printf '%s\n' \
            'Acquire::Retries "5";' \
            'Acquire::http::Timeout "30";' \
            'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/80-retries

      # A plain apt install, tried three times before failing the job. (An apt
      # package cache was tried here and left the libraries unlinkable: #151.)
      - name: WebKitGTK and its dependencies
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y $WEBKITGTK_PACKAGES; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed; retrying"
            sleep $((attempt * 15))
          done
          exit 1

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: The webview bundle
        run: npm run build

      - name: The shell
        working-directory: src-tauri
        run: cargo build --locked

      # The shell's one command orders the writes to a manuscript, so that a
      # save given up on cannot land over a later one (#64).
      - name: The shell's tests
        working-directory: src-tauri
        run: cargo test --locked
